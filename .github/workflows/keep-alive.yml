name: keep-alive-rebeca

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:        # permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Mantener Evolution despierto + reconfigurar webhook
        run: |
          echo "→ ping a Evolution"
          curl -m 20 https://evolution-9z0r.onrender.com || true

          echo "→ reconfigurar webhook"
          curl -m 30 -X POST "https://evolution-9z0r.onrender.com/webhook/set/sonriendo" \
            -H "apikey: miclave123" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://sonriendokids.vercel.app/api/rebeca","byEvents":true,"events":["MESSAGES_UPSERT"]}' || true

          echo "→ ping a bot Vercel"
          curl -m 20 https://sonriendokids.vercel.app/api/rebeca || true

          echo "✅ listo"
